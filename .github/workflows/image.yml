name: Build Debian SSH FRP Template Image

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional additional image tag to publish. Manual tags must start with manual-."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/enclava-labs/debian-ssh-frp-template
  MANUAL_VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_tag || '' }}

jobs:
  validate:
    name: Validate image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate manual image tag
        if: env.MANUAL_VERSION_TAG != ''
        run: |
          if [[ ! "${MANUAL_VERSION_TAG}" =~ ^manual-[a-z0-9][a-z0-9_.-]{0,119}$ ]]; then
            echo "::error::Manual image tags must match ^manual-[a-z0-9][a-z0-9_.-]{0,119}$ to avoid spoofing protected deployment tags."
            exit 1
          fi

      - name: Shell syntax
        run: |
          sh -n entrypoint.sh
          bash -n scripts/test-entrypoint.sh
          bash -n scripts/test-runtime-image.sh

      - name: Entrypoint contract
        run: |
          scripts/test-entrypoint.sh
          grep -q '/ssh.txt' README.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          tags: debian-ssh-frp-template:ci
          load: true
          provenance: false
          cache-from: type=gha

      - name: Runtime image contract
        run: scripts/test-runtime-image.sh debian-ssh-frp-template:ci

  publish:
    name: Publish signed image
    needs: validate
    # Consumers pin the keyless identity
    # https://github.com/enclava-labs/debian-ssh-frp-template/.github/workflows/image.yml@refs/heads/main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=${{ env.MANUAL_VERSION_TAG }},enable=${{ env.MANUAL_VERSION_TAG != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Write image digest artifact
        run: |
          mkdir -p dist
          printf '%s@%s\n' "${IMAGE_REPOSITORY}" "${{ steps.build.outputs.digest }}" > dist/debian-ssh-frp-template-image.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Verify signed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE_REPOSITORY}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null

      - name: Export and sign the security-patched FRP server
        run: |
          docker buildx build \
            --target frp-server-binary \
            --output type=local,dest=dist/frp-server \
            --cache-from type=gha \
            .
          cosign sign-blob --yes \
            --bundle dist/frp-server/frps.sigstore.json \
            dist/frp-server/frps

      - name: Upload image digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debian-ssh-frp-template-image
          path: |
            dist/debian-ssh-frp-template-image.txt
            dist/frp-server/
